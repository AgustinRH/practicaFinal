name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-all-errors -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel Deploy Hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-all-errors -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Trigger Railway Deploy Hook
        if: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL != '' }}
        continue-on-error: true
        run: curl -fsS --retry 3 --retry-all-errors -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"
