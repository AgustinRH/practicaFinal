name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        continue-on-error: true
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS --retry 3 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL no configurado, se omite este deploy."
          fi

      - name: Trigger Vercel Deploy Hook
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS --retry 3 --retry-all-errors -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "VERCEL_DEPLOY_HOOK_URL no configurado, se omite este deploy."
          fi

      - name: Trigger Railway Deploy Hook
        continue-on-error: true
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            curl -fsS --retry 3 --retry-all-errors -X POST "$RAILWAY_DEPLOY_HOOK_URL"
          else
            echo "RAILWAY_DEPLOY_HOOK_URL no configurado, se omite este deploy."
          fi
